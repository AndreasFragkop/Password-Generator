
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <!-- App styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header with title and theme toggle -->
        <div class="header">
            <h1>Password Generator</h1>
            <div class="theme-toggle">
                <span class="theme-toggle-label">Theme</span>
                <button class="theme-toggle-btn" id="themeToggle" type="button" aria-pressed="false">
                    <span class="theme-toggle-text" id="themeToggleText">Light</span>
                    <span class="theme-toggle-track" aria-hidden="true">
                        <span class="theme-toggle-thumb"></span>
                    </span>
                </button>
            </div>
        </div>

        <!-- Mode selector (password vs. passphrase) -->
        <div class="option mode-toggle">
            <label>Mode:</label>
            <div class="mode-options">
                <label class="radio-option">
                    <input type="radio" name="mode" value="password" checked>
                    Password
                </label>
                <label class="radio-option">
                    <input type="radio" name="mode" value="passphrase">
                    Passphrase
                </label>
            </div>
        </div>
        
        <!-- Password length input (hidden in passphrase mode) -->
        <div class="option" id="lengthOption">
            <label for="length">Password Length:</label>
            <input type="number" id="length" value="12" min="4" max="50">
        </div>

        <!-- Passphrase word count (visible in passphrase mode) -->
        <div class="option passphrase-option is-hidden" id="wordCountOption">
            <label for="wordCount">Word Count:</label>
            <input type="number" id="wordCount" value="4" min="2" max="10">
        </div>

        <!-- Passphrase separator selector (visible in passphrase mode) -->
        <div class="option passphrase-option is-hidden" id="separatorOption">
            <label for="separator">Separator:</label>
            <select id="separator">
                <option value="random" selected>Random</option>
                <option value="-">-</option>
                <option value=".">.</option>
                <option value="_">_</option>
                <option value="space">Space</option>
            </select>
        </div>
        
        <!-- Character set toggles -->
        <div class="option">
            <label for="uppercase">Include Uppercase Letters (A-Z)</label>
            <input type="checkbox" id="uppercase" checked>
        </div>
        
        <div class="option">
            <label for="lowercase">Include Lowercase Letters (a-z)</label>
            <input type="checkbox" id="lowercase" checked>
        </div>
        
        <div class="option">
            <label for="numbers">Include Numbers (0-9)</label>
            <input type="checkbox" id="numbers" checked>
        </div>
        
        <div class="option">
            <label for="symbols">Include Symbols (!@#$%^&*)</label>
            <input type="checkbox" id="symbols">
        </div>

        <div class="option">
            <label for="excludeSimilar">Exclude Similar Characters (O/0, l/1, I)</label>
            <input type="checkbox" id="excludeSimilar">
        </div>

        <!-- Generate action -->
        <button class="generate-btn" onclick="generatePassword()">Generate Password</button>
        
        <!-- Output display -->
        <div class="password-display" id="passwordDisplay">
            Click "Generate Password" to create your secure password
        </div>
        <!-- Strength + entropy meter -->
        <div class="strength-meter" id="strengthMeter" style="display: none;">
            <div>Password Strength: <span id="strengthText">Medium</span> <span id="entropyText"></span></div>
            <div class="strength-bar">
                <div class="strength-fill" id="strengthFill"></div>
            </div>
        </div>
        <!-- Copy action and feedback -->
        <button class="copy-btn-main" id="copyBtn" onclick="copyPassword()" data-default="Copy Password" style="display: none;">Copy Password</button>
        <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <!-- App logic -->
    <script src="script.js"></script>
</body>
</html>
